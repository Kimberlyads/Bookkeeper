<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookkeeper Kindle</title>
  <style>
    body { width: 340px; min-height: 280px; margin: 0; padding: 20px; font-family: Arial, sans-serif; background: #f8f5ef; color: #302b26; box-sizing: border-box; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { font-size: 14px; line-height: 1.5; margin: 0 0 12px; }
    label { font-size: 12px; color: #6b6259; display: block; margin-bottom: 4px; }
    input[type="text"] { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #cfc7bb; border-radius: 8px; box-sizing: border-box; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
    button { width: 100%; padding: 10px; margin-bottom: 8px; border: none; border-radius: 8px; background: #4d6655; color: white; font-size: 14px; cursor: pointer; }
    button:hover:not(:disabled) { background: #3c5143; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary { background: #6b6259; }
    button.secondary:hover:not(:disabled) { background: #534c45; }
    #status { margin-top: 8px; font-size: 12px; color: #6b6259; min-height: 36px; white-space: pre-wrap; }
    .progress-wrap { height: 8px; background: #e6e0d6; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; display: none; }
    .progress-bar { height: 100%; width: 0%; background: #4d6655; transition: width 0.25s ease; }
  </style>
</head>
<body>
  <h1>Bookkeeper 📚</h1>
  <p>Importe sua biblioteca Kindle e envie ao bot.</p>
  <label for="link-code">Código do Telegram (/conectar)</label>
  <input id="link-code" type="text" maxlength="16" placeholder="Ex.: A7K2M9QX" autocomplete="off">
  <button id="import-button">Buscar e enviar livros</button>
  <button id="export-button" class="secondary" disabled>Exportar JSON local</button>
  <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <p id="status">Abra Conteúdo e dispositivos do Kindle, cole o código e importe.</p>
  <script src="popup.js"></script>
</body>
</html>
