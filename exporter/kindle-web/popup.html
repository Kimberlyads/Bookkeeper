<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookkeeper Kindle</title>
  <style>
    body {
      width: 320px;
      min-height: 200px;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f8f5ef;
      color: #302b26;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #4d6655;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #3c5143;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #6b6259;
    }
  </style>
</head>
<body>
  <h1>Bookkeeper 📚</h1>
  <p>Vamos trazer sua biblioteca Kindle para cá.</p>

  <button id="import-button">Buscar meus livros</button>

  <p id="status">Abra sua biblioteca Kindle para começar.</p>

  <script src="popup.js"></script>
</body>
</html>
